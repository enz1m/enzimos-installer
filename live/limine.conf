timeout: 5
serial: yes

/Install enzimOS
    protocol: linux
    path: boot():/boot/vmlinuz-linux
    module_path: boot():/boot/enzimos-live.img
    cmdline: rd.systemd.gpt_auto=no quiet splash plymouth.ignore-serial-consoles loglevel=2 rd.systemd.show_status=false systemd.show_status=false rd.systemd.wants=enzimos-live-root.service systemd.firstboot=no console=tty0 console=ttyS0,115200 systemd.log_color=no panic=10

/Install enzimOS (text mode)
    protocol: linux
    path: boot():/boot/vmlinuz-linux
    module_path: boot():/boot/enzimos-live.img
    cmdline: rd.systemd.gpt_auto=no quiet splash plymouth.ignore-serial-consoles loglevel=2 rd.systemd.show_status=false systemd.show_status=false rd.systemd.wants=enzimos-live-root.service systemd.firstboot=no enzimos.text console=tty0 console=ttyS0,115200 systemd.log_color=no panic=10

/Rescue an existing enzimOS installation
    protocol: linux
    path: boot():/boot/vmlinuz-linux
    module_path: boot():/boot/enzimos-rescue.img
    cmdline: enzimos.installer-rescue=1 rdinit=/usr/lib/enzimos-native/enzimos-media-rescue-init loglevel=2 console=tty0 console=ttyS0,115200 panic=10
