# SPDX-License-Identifier: MIT
# enzimOS live medium initramfs: only finds the medium and assembles the live root
# (squashfs + RAM overlay); the installer itself runs in that root. No autodetect: the
# 'block' hook adds the generic storage/USB/NVMe/virtio drivers.
MODULES=(isofs sr_mod cdrom squashfs loop overlay virtio_pci virtio_blk virtio_scsi)
BINARIES=(/usr/bin/bash /usr/bin/blkid /usr/bin/mount /usr/bin/mkdir /usr/bin/seq /usr/bin/sleep /usr/bin/losetup)
FILES=(/usr/lib/enzimos-live/live-root.sh /usr/lib/systemd/system/enzimos-live-root.service)
HOOKS=(base systemd microcode modconf kms plymouth keyboard sd-vconsole block filesystems)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T1 -19)
